<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#c95616" />
  <title>Our Cookbook</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <header class="hero">
    <div class="hero-copy">
      <p class="eyebrow"><span class="book-icon">▣</span> Family Recipes</p>
      <h1>Our Cookbook</h1>
      <p class="subtitle">The recipes we actually make.</p>
    </div>
    <div class="hero-art" aria-hidden="true">
      <img src="wisconsin-board.png" alt="" />
    </div>
  </header>

  <main>
    <section id="homeView">
      <div class="controls">
        <label class="search-box">
          <span class="search-icon">⌕</span>
          <span class="sr-only">Search recipes</span>
          <input id="searchInput" type="search" placeholder="Search recipes or ingredients…" autocomplete="off" />
        </label>
        <div id="categoryButtons" class="category-row" aria-label="Recipe categories"></div>
      </div>

      <div class="section-heading">
        <h2 id="resultsTitle">All Recipes</h2>
        <span id="recipeCount"></span>
      </div>

      <div id="recipeGrid" class="recipe-grid"></div>
      <p id="emptyState" class="empty-state" hidden>No recipes found. Try another search or category.</p>
    </section>

    <section id="recipeView" class="recipe-view" hidden>
      <button id="backButton" class="back-button" type="button">← Back to recipes</button>
      <article id="recipeDetail"></article>
    </section>

    <section id="cookingView" class="cooking-view" hidden>
      <div id="cookingContent"></div>
    </section>
  </main>

  <footer id="siteFooter">
    <div class="footer-rule"><span>🍴</span></div>
    <p>Made with recipes worth keeping. <span aria-hidden="true">♥</span></p>
  </footer>

  <script src="recipes.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
